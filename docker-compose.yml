version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Knowledge base & ChromaDB
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty => the app calls same-origin "/api/...", which nginx proxies to
        # the api service below. No secret is ever passed as a build arg.
        VITE_API_BASE_URL: ""
    ports:
      - "5173:8080"
    environment:
      API_UPSTREAM: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
